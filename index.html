<style>
:root{--pink:#ed0088;--green:#075a38;--yellow:#ffe900;--cream:#fff8ef;--ink:#113b2c}
*{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
.page{min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.ribbon{position:absolute;pointer-events:none;z-index:-1}.ribbon.top{top:-108px;left:-118px;width:440px;height:250px;background:var(--pink);transform:rotate(-26deg);border-radius:0 0 52% 0;box-shadow:0 22px 0 var(--yellow),0 39px 0 var(--green)}.ribbon.bottom{right:-145px;bottom:-165px;width:550px;height:270px;background:var(--green);transform:rotate(-19deg);border-radius:60% 0 0 0;box-shadow:0 -21px 0 var(--yellow),0 -40px 0 var(--pink)}
.inner{width:min(100% - 40px,980px);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 0 84px}
.brand-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:30px}.logo{display:block;width:190px;height:190px;object-fit:contain;border-radius:28px;background:var(--yellow);box-shadow:8px 8px 0 var(--green);transform:rotate(-4deg)}.brand-divider{width:2px;height:105px;background:var(--green)}.venue-name{text-align:left;text-transform:uppercase;font-weight:900;letter-spacing:.12em;font-size:20px;line-height:1.25;max-width:180px}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:15px;margin:0 0 17px}.eyebrow:before,.eyebrow:after{content:"";height:2px;width:42px;background:var(--green)}
.brush{position:relative;display:inline-block;margin:0 0 10px;color:var(--pink);font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:clamp(24px,4vw,41px);transform:rotate(-2deg);z-index:0}.brush:before{content:"";position:absolute;inset:13% -5% 0;background:var(--yellow);border-radius:44% 10% 25% 18%;transform:rotate(-1deg);z-index:-1}
h1{font-family:Arial Black,Arial,Helvetica,sans-serif;font-weight:1000;text-transform:uppercase;letter-spacing:-.065em;line-height:.89;margin:14px 0 5px;font-size:clamp(68px,13.5vw,166px);color:var(--pink);-webkit-text-stroke:2px var(--green);text-shadow:5px 6px 0 var(--green)}.subhead{font-size:clamp(19px,3.1vw,33px);font-weight:900;text-transform:uppercase;letter-spacing:.24em;margin:12px 0 24px}
.event-card{display:flex;align-items:center;justify-content:center;gap:0;border:2px solid var(--pink);border-radius:999px;background:#fff;box-shadow:5px 5px 0 var(--yellow);overflow:hidden;font-weight:900;text-transform:uppercase;font-size:clamp(19px,3.1vw,30px);margin:10px 0 25px}.event-card span{padding:14px 25px}.event-card span+span{border-left:2px solid var(--pink)}.event-card b{color:var(--pink);margin-right:7px}
.copy{max-width:620px;line-height:1.45;font-size:18px;margin:0 0 25px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.actions a{text-decoration:none;border:2px solid var(--green);background:var(--green);color:#fff;border-radius:999px;padding:13px 22px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;box-shadow:4px 4px 0 var(--pink);transition:transform .2s}.actions a:nth-child(2){background:#fff;color:var(--green)}.actions a:hover{transform:translateY(-3px)}
.footer{position:relative;z-index:1;background:var(--pink);color:white;text-align:center;padding:15px 20px;font-weight:800;letter-spacing:.08em;font-size:14px}
.spark{position:absolute;color:var(--pink);font-size:42px;animation:float 4s ease-in-out infinite;pointer-events:none}.spark.one{left:11%;top:42%}.spark.two{right:12%;top:38%;animation-delay:-2s}.spark.three{left:22%;bottom:20%;color:var(--yellow);animation-delay:-1s}@keyframes float{50%{transform:translateY(-8px) rotate(14deg)}}
@media(max-width:650px){.ribbon.top{top:-86px;left:-105px;width:300px;height:170px;box-shadow:0 12px 0 var(--yellow),0 23px 0 var(--green)}.ribbon.bottom{right:-140px;bottom:-190px;width:370px;height:235px}.inner{width:min(100% - 30px,450px);padding:94px 0 55px}.brand-row{gap:15px;margin-bottom:26px}.logo{width:124px;height:124px;border-radius:18px;box-shadow:5px 5px 0 var(--green)}.brand-divider{height:72px}.venue-name{font-size:13px;max-width:125px}.eyebrow{font-size:11px;letter-spacing:.08em;gap:7px;line-height:1.35}.eyebrow:before,.eyebrow:after{width:20px;flex:none}.brush{font-size:26px}h1{font-size:clamp(51px,16vw,83px);-webkit-text-stroke:1.3px var(--green);text-shadow:3px 4px 0 var(--green);margin-top:12px}.subhead{font-size:17px;letter-spacing:.19em;margin:10px 0 16px}.event-card{font-size:16px;margin:7px 0 20px}.event-card span{padding:10px 13px}.copy{font-size:15px;margin-bottom:19px}.actions a{font-size:12px;padding:11px 16px}.spark{font-size:23px}.spark.one{left:3%;top:51%}.spark.two{right:4%;top:48%}.spark.three{display:none}.footer{font-size:11px;padding:13px}}
@media(prefers-reduced-motion:reduce){.spark{animation:none}.actions a{transition:none}}
</style>
</head>
